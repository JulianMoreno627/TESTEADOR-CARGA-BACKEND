# Base de datos para desarrollo. Usa el puerto 5433 para no chocar con un
# PostgreSQL instalado localmente en el 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: loadtester
      POSTGRES_PASSWORD: loadtester
      POSTGRES_DB: loadtester
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
